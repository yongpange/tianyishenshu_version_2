# GitHub Actions CI/CD 配置文件
# 这个文件定义了自动化测试的触发条件和执行流程

name: 天乙神算自动化测试

# 触发条件：什么时候运行测试
on:
  # 1. 当有人推送代码到main分支时
  push:
    branches: [ main, develop ]
  
  # 2. 当有人创建Pull Request时
  pull_request:
    branches: [ main ]
  
  # 3. 每天凌晨2点自动运行（定时任务）
  schedule:
    - cron: '0 2 * * *'
  
  # 4. 手动触发（可以在GitHub界面手动运行）
  workflow_dispatch:

# 定义任务
jobs:
  # 自动化测试任务
  selenium-tests:
    # 运行环境：使用GitHub提供的Ubuntu虚拟机
    runs-on: ubuntu-latest
    
    # 任务步骤
    steps:
    # 步骤1: 检出代码
    - name: 📥 检出代码
      uses: actions/checkout@v3
    
    # 步骤2: 设置Node.js环境（运行你的Next.js项目）
    - name: 🟢 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    # 步骤3: 安装项目依赖
    - name: 📦 安装项目依赖
      run: npm ci
    
    # 步骤4: 构建项目
    - name: 🔨 构建项目
      run: npm run build
    
    # 步骤5: 启动项目（后台运行）
    - name: 🚀 启动项目
      run: |
        npm start &
        sleep 10  # 等待项目启动
      env:
        NODE_ENV: test
    
    # 步骤6: 设置Python环境
    - name: 🐍 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # 步骤7: 安装Chrome浏览器
    - name: 🌐 安装Chrome浏览器
      uses: browser-actions/setup-chrome@latest
    
    # 步骤8: 安装Selenium依赖
    - name: 📦 安装Selenium依赖
      run: |
        cd selenium_tests
        pip install -r requirements.txt
    
    # 步骤9: 运行自动化测试
    - name: 🧪 运行自动化测试
      run: |
        cd selenium_tests
        python -m pytest tests/ -v --html=reports/test_report.html --self-contained-html
      env:
        TEST_BASE_URL: http://localhost:3000
        TEST_HEADLESS: true  # 无头模式运行
    
    # 步骤10: 上传测试报告
    - name: 📊 上传测试报告
      uses: actions/upload-artifact@v3
      if: always()  # 无论测试成功还是失败都上传报告
      with:
        name: selenium-test-reports
        path: selenium_tests/reports/
    
    # 步骤11: 上传测试截图
    - name: 📸 上传测试截图
      uses: actions/upload-artifact@v3
      if: failure()  # 只在测试失败时上传截图
      with:
        name: selenium-screenshots
        path: selenium_tests/screenshots/
    
    # 步骤12: 发送详细通知
    - name: 📧 发送测试结果通知
      if: always()
      run: |
        # 设置测试结果变量
        if [ "${{ job.status }}" == "success" ]; then
          STATUS_ICON="✅"
          STATUS_TEXT="测试通过"
          STATUS_COLOR="good"
        else
          STATUS_ICON="❌"
          STATUS_TEXT="测试失败"
          STATUS_COLOR="danger"
        fi

        # 创建通知消息
        echo "TEST_STATUS_ICON=$STATUS_ICON" >> $GITHUB_ENV
        echo "TEST_STATUS_TEXT=$STATUS_TEXT" >> $GITHUB_ENV
        echo "TEST_STATUS_COLOR=$STATUS_COLOR" >> $GITHUB_ENV

        # 输出测试摘要
        echo "## $STATUS_ICON 天乙神算自动化测试结果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**状态**: $STATUS_TEXT" >> $GITHUB_STEP_SUMMARY
        echo "**提交**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
        echo "**作者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**时间**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 [查看详细报告](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    # 步骤13: 创建Issue（测试失败时）
    - name: 🐛 创建测试失败Issue
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const title = `🚨 自动化测试失败 - ${context.payload.head_commit.message}`;
          const body = `
          ## 测试失败详情

          **提交信息**: ${context.payload.head_commit.message}
          **提交者**: ${context.actor}
          **分支**: ${context.ref}
          **失败时间**: ${new Date().toLocaleString('zh-CN')}

          ## 快速链接
          - 📊 [查看测试日志](${context.payload.repository.html_url}/actions/runs/${context.runId})
          - 📸 [查看失败截图](${context.payload.repository.html_url}/actions/runs/${context.runId}/artifacts)
          - 🔧 [查看提交详情](${context.payload.head_commit.url})

          ## 下一步行动
          - [ ] 查看测试日志定位问题
          - [ ] 修复代码问题
          - [ ] 重新运行测试
          - [ ] 关闭此Issue

          ---
          *此Issue由自动化测试系统自动创建*
          `;

          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['bug', 'automated-test', 'urgent']
          });

    # 步骤14: 发送企业微信通知
    - name: 📱 发送企业微信通知
      if: always()
      run: |
        # 如果配置了企业微信Webhook
        if [ -n "${{ secrets.WECHAT_WEBHOOK_URL }}" ]; then
          curl -X POST "${{ secrets.WECHAT_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"msgtype\": \"markdown\",
            \"markdown\": {
              \"content\": \"## ${{ env.TEST_STATUS_ICON }} 天乙神算测试结果\\n\\n**状态**: ${{ env.TEST_STATUS_TEXT }}\\n**提交**: ${{ github.event.head_commit.message }}\\n**作者**: ${{ github.actor }}\\n**时间**: $(date '+%Y-%m-%d %H:%M:%S')\\n\\n[查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
            }
          }"
        fi

  # 多浏览器测试任务
  cross-browser-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 🟢 设置Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: 📦 安装依赖并启动项目
      run: |
        npm ci
        npm run build
        npm start &
        sleep 10
    
    - name: 🐍 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 🌐 安装浏览器
      run: |
        if [ "${{ matrix.browser }}" = "chrome" ]; then
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
        elif [ "${{ matrix.browser }}" = "firefox" ]; then
          sudo apt-get update
          sudo apt-get install -y firefox
        fi
    
    - name: 🧪 运行${{ matrix.browser }}测试
      run: |
        cd selenium_tests
        pip install -r requirements.txt
        python -m pytest tests/ --browser=${{ matrix.browser }} --headless -v
      env:
        TEST_BASE_URL: http://localhost:3000
