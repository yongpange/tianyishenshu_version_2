[tool:pytest]
# pytest 配置文件

# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 标记定义
markers =
    smoke: 冒烟测试，核心功能快速验证
    regression: 回归测试，全面功能验证
    ui: UI界面测试
    api: API接口测试
    mobile: 移动端测试
    desktop: 桌面端测试
    slow: 运行较慢的测试
    auth: 认证相关测试
    profile: 个人信息相关测试
    dashboard: 仪表板相关测试
    reports: 报告生成相关测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 输出配置
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --capture=no

# 最小 Python 版本
minversion = 3.8

# 测试发现
norecursedirs = .git .tox dist build *.egg

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
