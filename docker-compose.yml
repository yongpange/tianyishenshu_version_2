# 天乙神算 Docker Compose 配置
# 用于本地开发和生产部署

version: '3.8'

services:
  # 主应用服务
  tianyishensuan-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tianyishensuan-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.production  # 生产环境变量文件
    volumes:
      # 挂载日志目录（可选）
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - tianyishensuan-network
    depends_on:
      - redis  # 如果使用Redis缓存
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis缓存服务（可选）
  redis:
    image: redis:7-alpine
    container_name: tianyishensuan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - tianyishensuan-network
    command: redis-server --appendonly yes

  # Nginx反向代理（生产环境推荐）
  nginx:
    image: nginx:alpine
    container_name: tianyishensuan-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL证书目录
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - tianyishensuan-network
    depends_on:
      - tianyishensuan-app

# 网络配置
networks:
  tianyishensuan-network:
    driver: bridge

# 数据卷配置
volumes:
  redis-data:
    driver: local
