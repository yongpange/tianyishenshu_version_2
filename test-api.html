<!DOCTYPE html>
<html>
<head>
    <title>测试兑换码API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { margin: 10px; padding: 10px 20px; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>兑换码API测试</h1>
    
    <button onclick="testGetCodes()">获取兑换码列表</button>
    <button onclick="testCreateCode()">生成新兑换码</button>
    
    <div id="results"></div>

    <script>
        function addResult(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'result ' + (isError ? 'error' : 'success');
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            document.getElementById('results').appendChild(div);
        }

        async function testGetCodes() {
            try {
                addResult('正在获取兑换码列表...');
                const response = await fetch('/api/invite-code/supabase');
                const result = await response.json();
                
                if (result.success) {
                    addResult(`✅ 成功获取 ${result.data.length} 个兑换码`);
                    result.data.forEach((code, index) => {
                        addResult(`${index + 1}. ${code.code} - ${code.status} - ${code.created_at}`);
                    });
                } else {
                    addResult(`❌ 获取失败: ${result.message}`, true);
                }
            } catch (error) {
                addResult(`❌ 请求失败: ${error.message}`, true);
            }
        }

        async function testCreateCode() {
            try {
                addResult('正在生成新兑换码...');
                const response = await fetch('/api/invite-code/supabase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        count: 1,
                        remarks: '测试页面生成 ' + new Date().toLocaleString()
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addResult(`✅ ${result.message}`);
                    if (result.data && result.data.length > 0) {
                        addResult(`新兑换码: ${result.data[0].code}`);
                    }
                    // 自动刷新列表
                    setTimeout(testGetCodes, 1000);
                } else {
                    addResult(`❌ 生成失败: ${result.message}`, true);
                }
            } catch (error) {
                addResult(`❌ 请求失败: ${error.message}`, true);
            }
        }

        // 页面加载时自动获取列表
        window.onload = testGetCodes;
    </script>
</body>
</html>
